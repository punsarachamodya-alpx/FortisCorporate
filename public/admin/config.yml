backend:
  name: github
  repo: punsarachamodya-alpx/fortiscorporate
  branch: main
  # Custom PHP OAuth proxy (see server/oauth/) — required because this site
  # runs on plain Hostinger hosting rather than Netlify, so it can't use
  # Netlify's built-in OAuth provider or git-gateway backend.
  base_url: https://fortiscorporate.com
  auth_endpoint: server/oauth/authorize.php

# TODO: confirm domain — this file assumes fortiscorporate.com. If the
# domain changes, update base_url above (and the GitHub OAuth App's
# callback URL) to match.

publish_mode: simple

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "services"
    label: "Services"
    description: "The seven service category pages shown on /services. Editing sub-service names/descriptions here updates the live site on next deploy."
    folder: "src/content/services"
    create: false
    delete: false
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Anchor (used in /services#anchor links — do not change without updating navigation)", name: "anchor", widget: "string" }
      - { label: "Display Order", name: "order", widget: "number" }
      - { label: "Summary", name: "summary", widget: "text" }
      - label: "Sub-services"
        name: "subservices"
        widget: "list"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }

  - name: "faq"
    label: "FAQ"
    description: "Questions shown on /faq. Keep answers general — no prices or turnaround times."
    folder: "src/content/faq"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Display Order", name: "order", widget: "number" }
      - { label: "Answer", name: "body", widget: "markdown" }

  - name: "guides"
    label: "Guides"
    description: "Guides shown on /resources."
    folder: "src/content/guides"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description (used in listing card & SEO)", name: "description", widget: "text" }
      - { label: "Publish Date", name: "publishDate", widget: "datetime" }
      - { label: "Draft (hide from site)", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "blog"
    label: "Blog Posts"
    description: "Blog posts shown on /blog. Set Draft to false to publish."
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description (used in listing card & SEO)", name: "description", widget: "text" }
      - { label: "Publish Date", name: "publishDate", widget: "datetime" }
      - { label: "Author", name: "author", widget: "string", default: "Fortis Corporate Services" }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Draft (hide from site)", name: "draft", widget: "boolean", default: true }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "compliance_calendar"
    label: "Compliance Calendar"
    description: "Deadlines shown on /resources. IMPORTANT: verify any date changes against current Sri Lankan regulatory sources before saving — these are indicative, not confirmed, dates."
    files:
      - file: "src/content/complianceDeadlines/deadlines.json"
        name: "deadlines"
        label: "Compliance Deadlines"
        fields:
          - label: "Deadlines"
            name: "deadlines"
            widget: "list"
            fields:
              - { label: "Obligation", name: "obligation", widget: "string" }
              - { label: "Applies To", name: "appliesTo", widget: "string" }
              - { label: "Indicative Timing", name: "indicativeTiming", widget: "string" }
              - { label: "Notes", name: "notes", widget: "string", required: false }

  # --- Site-wide settings & per-page copy ---------------------------------
  # Everything below edits text that used to be hardcoded in the page
  # templates — firm contact details, hero headlines, stats, and body copy
  # for every page on the site.
  - name: "site_content"
    label: "Site Settings & Page Copy"
    files:
      - file: "src/content/siteSettings/main.json"
        name: "settings"
        label: "Firm Details & Footer"
        description: "Legal/trading name, registration no., address, phone, WhatsApp, email, office hours, and the footer tagline. Used across the header, footer, contact page and structured data."
        fields:
          - { label: "Legal Name", name: "legalName", widget: "string" }
          - { label: "Trading Name", name: "tradingName", widget: "string" }
          - { label: "Company Registration No.", name: "registrationNo", widget: "string" }
          - { label: "Address Line 1", name: "addressLine1", widget: "string" }
          - { label: "Address Line 2", name: "addressLine2", widget: "string" }
          - { label: "Phone (display format, e.g. +94 77 655 3151)", name: "phoneDisplay", widget: "string" }
          - { label: "Phone (E.164 format for tel: links, e.g. +94776553151)", name: "phoneE164", widget: "string" }
          - { label: "WhatsApp Number (digits only, e.g. 94776553151)", name: "whatsappNumber", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Office Hours", name: "officeHours", widget: "string" }
          - { label: "Footer Tagline", name: "footerTagline", widget: "text" }

      - file: "src/content/homeContent/main.json"
        name: "home"
        label: "Home Page"
        fields:
          - { label: "Hero Eyebrow", name: "heroEyebrow", widget: "string" }
          - { label: "Hero Headline", name: "heroHeadline", widget: "string" }
          - { label: "Hero Subheadline", name: "heroSubheadline", widget: "text" }
          - label: "Stats Band"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Value", name: "value", widget: "number" }
              - { label: "Suffix (e.g. +)", name: "suffix", widget: "string", required: false }
              - { label: "Label", name: "label", widget: "string" }
          - { label: "Services Section — Eyebrow", name: "servicesEyebrow", widget: "string" }
          - { label: "Services Section — Heading", name: "servicesHeading", widget: "string" }
          - { label: "Why Fortis — Eyebrow", name: "whyFortisEyebrow", widget: "string" }
          - { label: "Why Fortis — Heading", name: "whyFortisHeading", widget: "string" }
          - label: "Why Fortis — Columns"
            name: "whyFortis"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
          - { label: "Who We Serve — Eyebrow", name: "whoWeServeEyebrow", widget: "string" }
          - { label: "Who We Serve — Heading", name: "whoWeServeHeading", widget: "string" }
          - label: "Who We Serve — Groups"
            name: "whoWeServe"
            widget: "list"
            fields:
              - { label: "Group", name: "group", widget: "string" }
              - { label: "Line", name: "line", widget: "string" }
          - { label: "Coverage Line", name: "coverageLine", widget: "text" }
          - { label: "Bottom CTA — Heading", name: "ctaHeading", widget: "string" }
          - { label: "Bottom CTA — Body", name: "ctaBody", widget: "text" }

      - file: "src/content/aboutContent/main.json"
        name: "about"
        label: "About Page"
        fields:
          - { label: "Hero Eyebrow", name: "heroEyebrow", widget: "string" }
          - { label: "Hero Heading", name: "heroHeading", widget: "string" }
          - label: "Paragraphs (HTML allowed, e.g. <strong>text</strong>)"
            name: "paragraphs"
            widget: "list"
            field: { label: "Paragraph", name: "paragraph", widget: "text" }
          - { label: "Stats — Eyebrow", name: "statsEyebrow", widget: "string" }
          - { label: "Stats — Heading", name: "statsHeading", widget: "string" }
          - label: "Stats"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Value (e.g. 30+)", name: "value", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
          - { label: "Bottom CTA — Heading", name: "ctaHeading", widget: "string" }
          - { label: "Bottom CTA — Body", name: "ctaBody", widget: "text" }

      - file: "src/content/servicesContent/main.json"
        name: "services_page"
        label: "Services Page"
        fields:
          - { label: "Hero Eyebrow", name: "heroEyebrow", widget: "string" }
          - { label: "Hero Heading", name: "heroHeading", widget: "string" }
          - { label: "Hero Subheading", name: "heroSubheading", widget: "text" }
          - { label: "Bottom CTA — Heading", name: "ctaHeading", widget: "string" }
          - { label: "Bottom CTA — Body", name: "ctaBody", widget: "text" }

      - file: "src/content/resourcesContent/main.json"
        name: "resources_page"
        label: "Resources Page"
        fields:
          - { label: "Hero Eyebrow", name: "heroEyebrow", widget: "string" }
          - { label: "Hero Heading", name: "heroHeading", widget: "string" }
          - { label: "Hero Subheading", name: "heroSubheading", widget: "text" }
          - { label: "Guides — Eyebrow", name: "guidesEyebrow", widget: "string" }
          - { label: "Guides — Heading", name: "guidesHeading", widget: "string" }
          - { label: "Compliance — Eyebrow", name: "complianceEyebrow", widget: "string" }
          - { label: "Compliance — Heading", name: "complianceHeading", widget: "string" }
          - { label: "Compliance — Intro (HTML allowed)", name: "complianceIntro", widget: "text" }
          - { label: "Compliance — Disclaimer", name: "complianceDisclaimer", widget: "text" }
          - { label: "Download Gate — Heading", name: "downloadGateHeading", widget: "string" }
          - { label: "Download Gate — Body", name: "downloadGateBody", widget: "text" }
          - { label: "Bottom CTA — Heading", name: "ctaHeading", widget: "string" }
          - { label: "Bottom CTA — Body", name: "ctaBody", widget: "text" }

      - file: "src/content/faqContent/main.json"
        name: "faq_page"
        label: "FAQ Page"
        fields:
          - { label: "Hero Eyebrow", name: "heroEyebrow", widget: "string" }
          - { label: "Hero Heading", name: "heroHeading", widget: "string" }
          - { label: "Bottom CTA — Heading", name: "ctaHeading", widget: "string" }
          - { label: "Bottom CTA — Body", name: "ctaBody", widget: "text" }

      - file: "src/content/contactContent/main.json"
        name: "contact_page"
        label: "Contact Page"
        fields:
          - { label: "Hero Eyebrow", name: "heroEyebrow", widget: "string" }
          - { label: "Hero Heading", name: "heroHeading", widget: "string" }
          - { label: "Hero Subheading", name: "heroSubheading", widget: "text" }
          - { label: "WhatsApp Button Label", name: "whatsappButtonLabel", widget: "string" }
          - { label: "Form Heading", name: "formHeading", widget: "string" }
          - { label: "Form Intro", name: "formIntro", widget: "text" }

  - name: "legal_pages"
    label: "Legal Pages"
    description: "Privacy Policy, Terms of Use, Cookie Notice and Disclaimer. These were drafted for launch — have them checked by a lawyer before relying on them, and keep them in sync with what the site actually does."
    folder: "src/content/legalPages"
    create: false
    delete: false
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Last Updated (display text, e.g. August 2026)", name: "lastUpdated", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
